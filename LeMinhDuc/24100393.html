<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới thiệu - [Tên bạn]</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .avatar {
            width: 150px; height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #667eea;
        }
        h1 { color: #333; margin: 15px 0 5px; }
        .mssv { color: #667eea; font-weight: bold; }
        .info { text-align: left; margin: 20px 0; }
        .info-row {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .label { font-weight: bold; color: #667eea; width: 120px; }
        .section { text-align: left; margin-top: 20px; }
        .section h2 { color: #667eea; font-size: 1.1em; margin-bottom: 8px; }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag {
            background: #f0f4ff; color: #667eea;
            padding: 5px 12px; border-radius: 15px; font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="avatar.jpg" alt="Ảnh đại diện" class="avatar">
        <h1>Lê Minh Đức</h1>
        <p class="mssv">MSSV: 24100393</p>

        <div class="info">
            <div class="info-row">
                <span class="label">Ngày sinh:</span>
                <span>21/05/2006</span>
            </div>
            <div class="info-row">
                <span class="label">Giới tính:</span>
                <span>Nam</span>
            </div>
            <div class="info-row">
                <span class="label">Lớp:</span>
                <span>CSE703064-1-1-26(COUR06.LT8)</span>
            </div>
        </div>

        <div class="section">
            <h2>Sở thích</h2>
            <div class="tags">
                <span class="tag">Lập trình</span>
                <span class="tag">Âm nhạc</span>
                <span class="tag">Games</span>
            </div>
        </div>

        <div class="section">
            <h2>Mục tiêu</h2>
            <p style="color:#666; line-height:1.6;">Trở thành lập trình viên</p>
        </div>
    </div>
</body>
</html>
